<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Kotliarenko Bogdan">
        <meta name="keywords" content="Таблиці в HTML">
        <meta name="description" content="Практична робота №4">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Практична робота №4</title>
        <style type="text/css">
            body{
                background-color: #ffffff;
                font-family: Verdana, sans-serif;
                color: #171717;
                margin: 100px;
            }
            summary{
                background-color: #0000ff;
                color: #ffffff;
            }
        </style>
        <link rel="icon" href="./SRC/gokity.gif">
    </head>
    <body>
        <details open>
            <summary>Об'єднання комірок</summary>
            <table align="center" width="800" border="0" bordercolor="#0000ff" rules="rows" cellpadding="5" cellspacing="0">
                <caption>Назва таблиці</caption>
                <thead>
                    <tr height="30" bgcolor="#ccffcc">
                        <th colspan="3">Верхній колонтитул</th>
                    </tr>
                </thead>
                <tbody>
                    <tr height="50">
                        <th>Заголовок стовпця 1</th>
                        <th>Заголовок стовпця 2</th>
                        <th>Заголовок стовпця 3</th>
                    </tr>
                    <tr height="50" valign="top">
                        <td>Комірка 1-1</td>
                        <td align="center">Комірка 1-2</td>
                        <td align="right">Комірка 1-3</td>
                    </tr>
                    <tr height="50" valign="bottom">
                        <td>Комірка 2-1</td>
                        <td align="center">Комірка 2-2</td>
                        <td align="right">Комірка 2-3</td>
                    </tr>
                    <tr height="50">
                        <td rowspan="2">Об'єднання комірок 3-1 – 4-1</td>
                        <td colspan="2">Об'єднання комірок 3-2 - 3-3</td>
                    </tr>
                    <tr height="50">
                        <td colspan="2">Об'єднання комірок 4-2 - 4-3</td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr height="30" bgcolor="#ccffcc">
                        <th colspan="3">Нижній колонтитул</th>
                    </tr>
                </tfoot>
            </table>
        </details>
    </body>
</html>
