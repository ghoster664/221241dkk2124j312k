<!DOCTYPE html>
<html lang="uk">
    <head>
        <meta charset="UTF-8">
        <meta name="author" content="Kotliarenko Bogdan">
        <meta name="keywords" content="web-tech">
        <meta name="description" content="PR5">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Форма</title>
        <style type="text/css">
            body{
                width: 460px;
                font-family:grotesk, sans-serif;
                color:#171717;
                margin: 100px auto;
            }
            form{
                background-color:rgba(255,255,255,0.8);
                border-radius:25px;
                border-color:#ff0000;
                border-width:3px;
                border-style:solid;
                padding:0 20px;
                font-size:16px;
                font-weight:bold;
            }
        </style>
        <link rel="icon" href="../SRC/gokity.gif">
    </head>
    <body>
        <form name="Текстові поля">
            <p>
                <label for="lastname">Прізвище:</label><br>
                <input type="text" name="lastname" id="lastname" placeholder="Введіть прізвище" maxlength="20" style="width: 100%; height: 30px">
            </p>
            <p>
                <label for="firstname">Ім'я:</label><br>
                <input type="text" name="firstname" id="firstname" placeholder="Введіть ім'я" maxlength="20" style="width: 100%; height: 30px">
            </p>
            <p>
                <label for="date">Дата народження:</label><br>
                <input type="date" name="date" id="date" style="width: 100%; height: 30px">
            </p>
            <p>
                <label for="password">Пароль:</label><br>
                <input type="password" name="password" id="password" style="width: 100%; height: 30px">
            </p>
            <p>
                <label for="coment">Коментар:</label>
                <textarea required id="coment" cols="45" rows="5"></textarea>
            </p>
            <p style="text-align: center">
                <input type="submit" name="submit" value="Відправити">
            </p>
            <p style="text-align: center"><a href="z5.1.html">← На головну</a></p>
        </form>
    </body>
</html>
